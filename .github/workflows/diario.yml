name: Diario de las 8

on:
  schedule:
    - cron: "15 5 * * *"   # 07:15 en verano, 06:15 en invierno (hora de Madrid)
  workflow_dispatch:        # botón «Run workflow» para regenerarlo a mano

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generar.py
      - name: Guardar la edición
        run: |
          git config user.name "diario-bot"
          git config user.email "diario-bot@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Edición $(TZ=Europe/Madrid date +%F)" || echo "Sin cambios"
          git push
